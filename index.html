<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka — Enterprise Yandex Engine</title>
    
    <!-- ЯДРО ЯНДЕКС КАРТ ДЛЯ ВЫСОКИХ РАЗРЕШЕНИЙ -->
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
    
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-grid: #121218;
            --card-glass: rgba(20, 20, 26, 0.95);
            --accent-blue: #0066ff;
            --accent-green: #2ecc71;
            --accent-red: #ff4757; 
            --text-main: #ffffff;
            --text-muted: #747d8c;
            --border: rgba(255, 255, 255, 0.1);
            --shadow-neon: rgba(0, 102, 255, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        .app-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
            z-index: 10;
        }

        #screen-login.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #screen-map.active {
            display: block;
        }

        /* ==========================================================================
           ЭКРАН АВТОРИЗАЦИИ И ТАКТИЧЕСКИЙ РАДАР
           ========================================================================== */
        .tactical-grid {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            z-index: 1;
        }

        .tactical-grid::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 120px; height: 120px;
            border: 1px dashed rgba(0, 102, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: radarPulse 4s linear infinite;
        }

        .login-container {
            width: 88%; max-width: 360px; padding: 40px 30px;
            background: var(--card-glass);
            border: 1px solid var(--border); border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .brand-header { text-align: center; margin-bottom: 35px; }
        .brand-logo {
            font-size: 30px; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-tagline { font-size: 11px; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 3px; }

        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input {
            width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; outline: none; color: var(--text-main); font-size: 16px; transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: var(--accent-blue); background: rgba(0, 102, 255, 0.02); box-shadow: 0 0 15px var(--shadow-neon); }
        .input-group label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: all 0.25s ease; font-size: 15px; }
        
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px; left: 12px; font-size: 11px; color: #fff; background: #0c0c12; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
        }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--text-main);
            border: none; border-radius: 14px; color: var(--bg-dark); font-size: 15px; font-weight: 800; cursor: pointer;
            transition: all 0.2s ease; letter-spacing: 1px;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* ==========================================================================
           ИГРОВОЙ HUD (ИНТЕРФЕЙС ИЗ СКЕТЧА)
           ========================================================================== */
        #map-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }
        
        .hud-top-panel {
            position: absolute; top: 20px; left: 20px;
            display: flex; align-items: center; gap: 12px;
            z-index: 9999; pointer-events: none;
        }

        .hud-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            border: 2px solid var(--border); background-color: #1a1a24;
            background-size: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            pointer-events: auto; flex-shrink: 0;
        }

        .hud-stats-badge {
            background: var(--card-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 16px; padding: 12px 24px;
            display: flex; align-items: center; gap: 16px; color: #ffffff;
            font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); pointer-events: auto;
        }

        .stats-divider { color: rgba(255, 255, 255, 0.15); font-weight: 300; }
        .stats-val { color: var(--accent-blue); font-weight: 800; margin-left: 6px; }

        /* Глушим футер Яндекса, чтобы не перекрывал игровые элементы */
        .ymaps-2-1-79-controls__bottom { display: none !important; }
        .ymaps-2-1-79-copyright { background: rgba(255,255,255,0.6) !important; border-radius: 4px; padding: 0 4px; }

        @keyframes radarPulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- СЦЕНА 1: ЛОГИН -->
    <div id="screen-login" class="app-screen active">
        <div class="tactical-grid"></div>
        <div class="login-container">
            <div class="brand-header">
                <h1 class="brand-logo">GEOMETKA</h1>
                <p class="brand-tagline">Яндекс Навигация</p>
            </div>

            <form id="loginForm" onsubmit="handleLocalLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autocomplete="off">
                    <label for="username">Твой уникальный ник</label>
                </div>
                <button type="submit" class="btn-submit">ЗАПУСК ENGINE</button>
            </form>
        </div>
    </div>

    <!-- СЦЕНА 2: КАРТА -->
    <div id="screen-map" class="app-screen">
        <div class="hud-top-panel">
            <div class="hud-avatar" id="player-avatar" onclick="SoundMatrix.playClick()"></div>
            <div class="hud-stats-badge">
                <div>шаги:<span class="stats-val" id="hud-steps">0</span></div>
                <div class="stats-divider">|</div>
                <div>сектора:<span class="stats-val" id="hud-captured">0</span></div>
            </div>
        </div>
        <div id="map-container"></div>
    </div>

    <script>
        // ==========================================================================
        // ЯДРО СТРУКТУРЫ ДАННЫХ ИГРЫ
        // ==========================================================================
        const AppState = {
            username: null,
            uid: null,
            metrics: {
                steps: 0,
                capturedZones: 0,
                totalDistanceMeters: 0,
                lastLat: null,
                lastLng: null
            },
            config: {
                gridSizeDegrees: 0.0012, // Размер квадрата сектора
                salekhardCenter: [66.5300, 66.6150] // Координаты Салехарда
            }
        };

        // ==========================================================================
        // СИНТЕЗАТОР НЕОНОВЫХ ЗВУКОВ ИНТЕРФЕЙСА (WEB AUDIO API)
        // ==========================================================================
        const SoundMatrix = {
            ctx: null,
            init() { 
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
            },
            playClick() {
                this.init();
                let osc = this.ctx.createOscillator(); 
                let gain = this.ctx.createGain();
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(880, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination); 
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            },
            playSuccess() {
                this.init();
                let osc = this.ctx.createOscillator(); 
                let gain = this.ctx.createGain();
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination); 
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }
        };

        // ==========================================================================
        // КАРТОГРАФИЧЕСКИЙ ДВИЖОК ЯНДЕКСА
        // ==========================================================================
        let map = null;
        let playerMarker = null;
        let gridCollection = null;

        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLocalLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (username) {
                SoundMatrix.playSuccess();
                savePlayerSession(username, 'USER_' + username);
                bootIntoGame();
            }
        }

        function savePlayerSession(name, uid) {
            localStorage.setItem('geo_username', name);
            localStorage.setItem('geo_uid', uid);
            AppState.username = name; 
            AppState.uid = uid;
        }

        function bootIntoGame() {
            switchScreen('screen-map');
            // Принудительное ожидание готовности серверов Яндекса
            ymaps.ready(initGameEngine);
        }

        function initGameEngine() {
            console.log("Запуск Яндекс Картографии...");
            document.getElementById('player-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/bottts/svg?seed=${AppState.username}')`;

            if (!map) {
                // Инициализация карты Яндекса
                map = new ymaps.Map("map-container", {
                    center: AppState.config.salekhardCenter,
                    zoom: 16,
                    controls: ['zoomControl'] 
                }, {
                    // Тонкая настройка жестов, инерции и фикса кнопок зума под пальцы
                    zoomControlPosition: { right: 20, bottom: 50 },
                    suppressMapOpenBlock: true,
                    yandexMapAutoInvert: false
                });

                // Создаем контейнер для полигонов сетки
                gridCollection = new ymaps.GeoObjectCollection();
                map.geoObjects.add(gridCollection);

                // Вешаем звук клика на карту
                map.events.add('click', () => SoundMatrix.playClick());
            }

            startLocationTracking();
        }

        // ==========================================================================
        // GPS МОДУЛЬ И МАТЕМАТИКА ДВИЖЕНИЯ (HAVERSINE ALGORITHM)
        // ==========================================================================
        function startLocationTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Считаем шаги по расстоянию между точками GPS
                        if (AppState.metrics.lastLat !== null && AppState.metrics.lastLng !== null) {
                            const distance = calculateDistance(AppState.metrics.lastLat, AppState.metrics.lastLng, lat, lng);
                            if (distance > 1.8) { // Фильтруем погрешности датчика
                                AppState.metrics.totalDistanceMeters += distance;
                                AppState.metrics.steps = Math.floor(AppState.metrics.totalDistanceMeters * 1.4);
                                document.getElementById('hud-steps').innerText = AppState.metrics.steps;
                            }
                        }

                        AppState.metrics.lastLat = lat; 
                        AppState.metrics.lastLng = lng;

                        // Четкая точка игрока без громоздких кругов
                        if (!playerMarker) {
                            playerMarker = new ymaps.Placemark([lat, lng], {}, {
                                preset: 'islands#blueCircleDotIcon',
                                iconColor: '#0066ff'
                            });
                            map.geoObjects.add(playerMarker);
                            map.setCenter([lat, lng], 17);
                        } else {
                            playerMarker.geometry.setCoordinates([lat, lng]);
                        }

                        // Перегенерация тактической сетки
                        generateTacticalGrid(lat, lng);
                    },
                    (error) => {
                        console.error("GPS Sensor Offline:", error);
                        // Тестовая генерация сетки на ПК в Салехарде при отсутствии GPS
                        generateTacticalGrid(AppState.config.salekhardCenter[0], AppState.config.salekhardCenter[1]);
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );
            }
        }

        // Математическая формула Гаверсинуса для вычисления метров на сфере Земли
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const rad = Math.PI / 180;
            const dLat = (lat2 - lat1) * rad; 
            const dLon = (lon2 - lon1) * rad;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        // ==========================================================================
        // ПРОЦЕДУРНЫЙ ГЕНЕРАТОР КВАДРАТОВ ЗАХВАТА СЕКТОРОВ
        // ==========================================================================
        function generateTacticalGrid(centerLat, centerLng) {
            if (!gridCollection) return;
            gridCollection.removeAll(); // Очищаем старые зоны, чтобы не грузить ОЗУ смартфона

            const step = AppState.config.gridSizeDegrees;
            const range = 3; // Радиус видимости квадратов вокруг игрока

            const baseLat = Math.floor(centerLat / step) * step;
            const baseLng = Math.floor(centerLng / step) * step;

            for (let i = -range; i <= range; i++) {
                for (let j = -range; j <= range; j++) {
                    const sLat = baseLat + (i * step);
                    const sLng = baseLng + (j * step);

                    const bounds = [
                        [sLat, sLng],
                        [sLat + step, sLng + step]
                    ];

                    // Распределяем тестовые статусы зон по хэшу координат
                    let zoneColor = '#747d8c'; 
                    let isCaptured = false;

                    const hash = (sLat + sLng).toString();
                    if (hash.includes('2') || hash.includes('6')) {
                        zoneColor = '#2ecc71'; // Твой захваченный зеленый сектор
                        isCaptured = true;
                    } else if (hash.includes('4')) {
                        zoneColor = '#ff4757'; // Вражеский красный сектор
                    }

                    // Отрисовка прямоугольника Яндекса
                    const rectangle = new ymaps.Rectangle(bounds, {}, {
                        fillColor: zoneColor,
                        fillOpacity: isCaptured ? 0.25 : 0.06,
                        strokeColor: zoneColor,
                        strokeWidth: 1,
                        strokeOpacity: 0.3
                    });

                    // Клик по сектору — фиксация и захват территории
                    rectangle.events.add('click', (e) => {
                        SoundMatrix.playSuccess();
                        rectangle.options.set({
                            fillColor: '#2ecc71',
                            strokeColor: '#2ecc71',
                            fillOpacity: 0.25
                        });
                        AppState.metrics.capturedZones++;
                        document.getElementById('hud-captured').innerText = AppState.metrics.capturedZones;
                    });

                    gridCollection.add(rectangle);
                }
            }
        }

        // Автоматический вход по токену памяти
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('geo_username');
            const savedUID = localStorage.getItem('geo_uid');
            if (savedName && savedUID) {
                AppState.username = savedName; 
                AppState.uid = savedUID;
                bootIntoGame();
            }
        });
    </script>
</body>
</html>
