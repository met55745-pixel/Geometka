<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka</title>
    <!-- Подключаем стили карты Leaflet сразу в шапке -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #08080c;
            --card-glass: rgba(18, 18, 24, 0.8);
            --border-glow: rgba(255, 71, 87, 0.2);
            --accent-neon: #ff4757; 
            --text-main: #ffffff;
            --text-muted: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        /* Анимация переключения экранов */
        .app-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
            transition: opacity 0.3s ease;
        }

        .app-screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           МОДУЛЬ 1: СТИЛЬНЫЙ ВХОД (LOGIN SCREEN)
           ========================================================================== */
        #screen-login {
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #screen-login::before, #screen-login::after {
            content: ''; position: absolute; border-radius: 50%; filter: blur(120px); z-index: 1; opacity: 0.35;
        }
        #screen-login::before { width: 300px; height: 300px; background: var(--accent-neon); top: -50px; right: -50px; }
        #screen-login::after { width: 250px; height: 250px; background: #1e90ff; bottom: -50px; left: -50px; }

        .login-container {
            width: 90%; max-width: 380px; padding: 40px 30px;
            background: var(--card-glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px var(--border-glow);
            z-index: 10;
        }

        .brand-header { text-align: center; margin-bottom: 40px; }
        .brand-logo {
            font-size: 32px; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 40%, var(--accent-neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;
        }
        .brand-tagline { font-size: 13px; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input {
            width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; outline: none; color: var(--text-main); font-size: 16px; transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: var(--accent-neon); background: rgba(255, 71, 87, 0.02); box-shadow: 0 0 15px rgba(255, 71, 87, 0.15); }
        .input-group label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: all 0.3s ease; font-size: 15px; }
        
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -10px; left: 12px; font-size: 12px; color: var(--accent-neon); background: #06060a; padding: 2px 8px; border-radius: 4px;
        }

        .btn-submit {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent-neon), #ff6b81);
            border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4); transition: transform 0.2s;
        }
        .btn-submit:active { transform: scale(0.98); }

        /* ==========================================================================
           МОДУЛЬ 2: ИГРОВАЯ КАРТА (MAP SCREEN)
           ========================================================================== */
        #screen-map {
            z-index: 50;
            background: #000;
        }

        #map-container {
            width: 100vw;
            height: 100vh;
        }

        .map-placeholder-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--text-muted); font-size: 18px; text-align: center; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: АВТОРИЗАЦИЯ (Активен по умолчанию) -->
    <div id="screen-login" class="app-screen active">
        <div class="login-container">
            <div class="brand-header">
                <h1 class="brand-logo">GEOMETKA</h1>
                <p class="brand-tagline">Захват территории</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autocomplete="off">
                    <label for="username">Твой никнейм</label>
                </div>

                <div class="input-group">
                    <input type="password" id="roomCode" placeholder=" " autocomplete="off">
                    <label for="roomCode">Код комнаты (если есть)</label>
                </div>

                <button type="submit" class="btn-submit">Войти в игру</button>
            </form>
        </div>
    </div>

    <!-- ЭКРАН 2: ИГРОВОЕ ПОЛЕ И КАРТА -->
    <div id="screen-map" class="app-screen">
        <div class="map-placeholder-text">Бро, тут будет наша новая темная карта Салехарда! 🗺️</div>
        <div id="map-container"></div>
    </div>

    <!-- Подключаем скрипты в самом конце -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <script>
        // Функция переключения модулей (экранов)
        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // Логика модуля авторизации
        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            
            if (username) {
                localStorage.setItem('p_username', username);
                
                // Переключаемся на модуль карты БЕЗ перезагрузки страницы!
                switchScreen('screen-map');
                
                // Тут мы запустим инициализацию карты и сокетов
                initGame(); 
            }
        }

        // Будущий модуль инициализации игры
        function initGame() {
            console.log("Игра стартовала! Подключаем сокеты и GPS...");
            // Сюда мы перепишем чистый код Leaflet и Socket.io домена pixselbatll.onrender.com
        }

        // Проверка сохраненного имени при старте APK
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('p_username');
            if (savedName) {
                document.getElementById('username').value = savedName;
            }
        });
    </script>
</body>
</html>
