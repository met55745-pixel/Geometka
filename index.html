<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-grid: #121218;
            --card-glass: rgba(20, 20, 26, 0.9);
            --accent-gray: #2f3542;
            --accent-red: #ff4757; 
            --text-main: #ffffff;
            --text-muted: #747d8c;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        .app-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
        }

        #screen-login.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #screen-map.active {
            display: block;
        }

        /* ==========================================================================
           ТАКТИЧЕСКИЙ ФОН ЛОГИНА
           ========================================================================== */
        .tactical-grid {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            z-index: 1;
        }

        .tactical-grid::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* ==========================================================================
           МОДУЛЬ 1: ВХОД
           ========================================================================== */
        #screen-login {
            z-index: 100;
        }

        .login-container {
            width: 88%; max-width: 360px; padding: 35px 25px;
            background: var(--card-glass);
            border: 1px solid var(--border); border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .brand-header { text-align: center; margin-bottom: 35px; }
        .brand-logo {
            font-size: 28px; font-weight: 800; letter-spacing: 1px;
            color: var(--text-main); text-transform: uppercase;
        }
        .brand-tagline { font-size: 11px; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 15px 18px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; outline: none; color: var(--text-main); font-size: 15px; transition: all 0.25s ease;
        }
        .input-group input:focus { border-color: var(--text-muted); background: rgba(255, 255, 255, 0.05); }
        .input-group label { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: all 0.25s ease; font-size: 14px; }
        
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -9px; left: 10px; font-size: 11px; color: var(--text-main); background: #131318; padding: 2px 6px; border-radius: 4px;
        }

        .btn-submit {
            width: 100%; padding: 15px; background: var(--text-main);
            border: none; border-radius: 12px; color: var(--bg-dark); font-size: 15px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s; margin-bottom: 15px;
        }
        .btn-submit:active { opacity: 0.8; }

        /* ==========================================================================
           МОДУЛЬ 2: ИГРОВАЯ КАРТА И ТАКТИЧЕСКИЙ HUD
           ========================================================================== */
        #screen-map { 
            z-index: 50; 
            background: #000; 
        }
        
        #map-container { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 10;
        }
        
        .hud-top-panel {
            position: absolute;
            top: 16px; left: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 999;
            pointer-events: none;
        }

        .hud-avatar {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background-color: #1a1a24;
            background-size: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            pointer-events: auto;
        }

        .hud-stats-badge {
            background: var(--card-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
        }

        .stats-divider {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 300;
        }

        .stats-val {
            color: #ffffff;
            font-weight: 700;
            margin-left: 4px;
        }

        /* 🛡️ БУЛЛЕТПРУФ-ФИКС: Прячем зум слева сверху на уровне стилей, если кэш залагал */
        .leaflet-top.leaflet-left .leaflet-control-zoom {
            display: none !important;
        }

        /* Кастомизация кнопок зума в правом нижнем углу */
        .leaflet-control-zoom {
            border: 1px solid var(--border) !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;
            margin-bottom: 25px !important; 
            margin-right: 15px !important;
        }
        .leaflet-control-zoom-in, .leaflet-control-zoom-out {
            background: var(--card-glass) !important;
            color: #fff !important;
            border-bottom: 1px solid var(--border) !important;
        }
        .leaflet-bar a:hover { background: rgba(255,255,255,0.05) !important; }
        .leaflet-control-attribution { background: transparent !important; color: rgba(255,255,255,0.1) !important; }
    </style>
</head>
<body>

    <div id="screen-login" class="app-screen active">
        <div class="tactical-grid"></div>
        <div class="login-container">
            <div class="brand-header">
                <h1 class="brand-logo">GEOMETKA</h1>
                <p class="brand-tagline">Захват территории</p>
            </div>

            <form id="loginForm" onsubmit="handleLocalLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autocomplete="off">
                    <label for="username">Твой уникальный ник</label>
                </div>
                <button type="submit" class="btn-submit">Войти по нику</button>
            </form>
        </div>
    </div>

    <div id="screen-map" class="app-screen">
        <div class="hud-top-panel">
            <div class="hud-avatar" id="player-avatar"></div>
            <div class="hud-stats-badge">
                <div>шаги:<span class="stats-val" id="hud-steps">0</span></div>
                <div class="stats-divider">|</div>
                <div>захвачено:<span class="stats-val" id="hud-captured">0%</span></div>
            </div>
        </div>
        <div id="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <script>
        let currentUsername = null;
        let playerUID = null;
        
        let map = null;
        let playerMarker = null;
        let playerAccuracyCircle = null;

        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function handleLocalLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (username) {
                savePlayerSession(username, 'USER_' + username);
                bootIntoGame();
            }
        }

        function savePlayerSession(name, uid) {
            localStorage.setItem('geo_username', name);
            localStorage.setItem('geo_uid', uid);
            currentUsername = name;
            playerUID = uid;
        }

        function bootIntoGame() {
            switchScreen('screen-map');
            initGameEngine();
        }

        function initGameEngine() {
            console.log(`Инициализация для: ${currentUsername}`);
            
            document.getElementById('player-avatar').style.backgroundImage = `url('https://api.dicebear.com/7.x/bottts/svg?seed=${currentUsername}')`;

            if (!map) {
                map = L.map('map-container', {
                    zoomControl: false, // Отключаем дефолтный зум
                    attributionControl: true
                }).setView([66.5300, 66.6150], 16);

                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19
                }).addTo(map);

                // Создаем зум заново, принудительно двигая его в правый нижний угол
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }

            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                }
            }, 300);

            startLocationTracking();
        }

        function startLocationTracking() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        if (!playerMarker) {
                            playerAccuracyCircle = L.circle([lat, lng], {
                                radius: accuracy,
                                color: '#1e90ff',
                                fillColor: '#1e90ff',
                                fillOpacity: 0.12,
                                weight: 1
                            }).addTo(map);

                            playerMarker = L.circleMarker([lat, lng], {
                                radius: 8,
                                color: '#ffffff',
                                fillColor: '#0066ff',
                                fillOpacity: 1,
                                weight: 2
                            }).addTo(map);

                            map.setView([lat, lng], 17);
                        } else {
                            playerMarker.setLatLng([lat, lng]);
                            playerAccuracyCircle.setLatLng([lat, lng]);
                            playerAccuracyCircle.setRadius(accuracy);
                        }
                    },
                    (error) => { console.error("GPS error:", error); },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
                );
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('geo_username');
            const savedUID = localStorage.getItem('geo_uid');

            if (savedName && savedUID) {
                currentUsername = savedName;
                playerUID = savedUID;
                bootIntoGame();
            }
        });
    </script>
</body>
</html>
