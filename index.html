<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GeoMetka</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-grid: #121218;
            --card-glass: rgba(20, 20, 26, 0.9);
            --accent-gray: #2f3542;
            --accent-red: #ff4757; 
            --text-main: #ffffff;
            --text-muted: #747d8c;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            height: 100vh;
            overflow: hidden;
            position: relative;
            color: var(--text-main);
        }

        .app-screen {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: none;
        }

        .app-screen.active {
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           НОВЫЙ ТАКТИЧЕСКИЙ ФОН (Серый радар / Координатная сетка)
           ========================================================================== */
        .tactical-grid {
            position: absolute;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            z-index: 1;
        }

        /* Декоративное перекрестие по центру в стиле прицела навигатора */
        .tactical-grid::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100px; height: 100px;
            border: 1px dashed rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* ==========================================================================
           МОДУЛЬ 1: МИНИМАЛИСТИЧНЫЙ ВХОД
           ========================================================================== */
        #screen-login {
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .login-container {
            width: 88%; max-width: 360px; padding: 35px 25px;
            background: var(--card-glass);
            border: 1px solid var(--border); border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .brand-header { text-align: center; margin-bottom: 35px; }
        .brand-logo {
            font-size: 28px; font-weight: 800; letter-spacing: 1px;
            color: var(--text-main); text-transform: uppercase;
        }
        .brand-tagline { font-size: 11px; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; letter-spacing: 2px; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 15px 18px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; outline: none; color: var(--text-main); font-size: 15px; transition: all 0.25s ease;
        }
        .input-group input:focus { border-color: var(--text-muted); background: rgba(255, 255, 255, 0.05); }
        .input-group label { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: all 0.25s ease; font-size: 14px; }
        
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -9px; left: 10px; font-size: 11px; color: var(--text-main); background: #131318; padding: 2px 6px; border-radius: 4px;
        }

        .btn-submit {
            width: 100%; padding: 15px; background: var(--text-main);
            border: none; border-radius: 12px; color: var(--bg-dark); font-size: 15px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s; margin-bottom: 15px;
        }
        .btn-submit:active { opacity: 0.8; }

        /* ==========================================================================
           МОДУЛЬ 2: ИГРОВАЯ КАРТА
           ========================================================================== */
        #screen-map { z-index: 50; background: #000; }
        #map-container { width: 100vw; height: 100vh; }
        .map-placeholder-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--text-muted); font-size: 16px; text-align: center; pointer-events: none; z-index: 999;
        }
    </style>
</head>
<body>

    <div id="screen-login" class="app-screen active">
        <div class="tactical-grid"></div>
        <div class="login-container">
            <div class="brand-header">
                <h1 class="brand-logo">GEOMETKA</h1>
                <p class="brand-tagline">Захват территории</p>
            </div>

            <form id="loginForm" onsubmit="handleLocalLogin(event)">
                <div class="input-group">
                    <input type="text" id="username" placeholder=" " required autocomplete="off">
                    <label for="username">Твой уникальный ник</label>
                </div>
                <button type="submit" class="btn-submit">Войти по нику</button>
            </form>
        </div>
    </div>

    <div id="screen-map" class="app-screen">
        <div class="map-placeholder-text">Карта Салехарда загружается... 🗺️</div>
        <div id="map-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    
    <script>
        let currentUsername = null;
        let playerUID = null;

        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => screen.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Вход по нику
        function handleLocalLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (username) {
                savePlayerSession(username, 'USER_' + username);
                bootIntoGame();
            }
        }

        // Сохранение сессии
        function savePlayerSession(name, uid) {
            localStorage.setItem('geo_username', name);
            localStorage.setItem('geo_uid', uid);
            currentUsername = name;
            playerUID = uid;
        }

        function bootIntoGame() {
            switchScreen('screen-map');
            initGameEngine();
        }

        function initGameEngine() {
            console.log(`Инициализация для: ${currentUsername} (UID: ${playerUID})`);
        }

        // Авто-вход
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('geo_username');
            const savedUID = localStorage.getItem('geo_uid');

            if (savedName && savedUID) {
                currentUsername = savedName;
                playerUID = savedUID;
                bootIntoGame();
            }
        });
    </script>
</body>
</html>
